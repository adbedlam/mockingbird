user: Nikita

other: Исаев Фембой

building_model:
  host: https://openrouter.ai/api/v1
  model: openai/gpt-6-luna
  temperature: 0.3

inference_model:
  host: https://openrouter.ai/api/v1
  model: openai/gpt-6-astra
  temperature: 0.7

# inference_model:
#   host: https://openrouter.ai/api/v1
#   model: openai/gpt-6-luna
#   temperature: 0.7


vision_model:
  host: http://localhost:1235/v1
  model: qwen3.5-2b
  temperature: 0.1

preprocessing:
  message_start: 0
  message_end: 500
  messenger: telegram

profile_build:
  chunk_size: 500

runtime_context:
  recent_messages: 20

evaluation:
  message_start: 7000
  message_end: 8500
  window_size: 15
  max_predictions: 30

temporial:
  message_start: 6000
  message_end: 8500

diary:
  update_every_messages: 100

messaging_harness:
  conversation_window: 600
  busy:
    bin_size: 900
    max_duration: 10800
    randomness_interval: 1800
  burst:
    window: 600
    delay_bin_size: 1
    smoothing_sigma: 2
  response_delay:
    window: 600
    bin_size: 1
    smoothing_sigma: 2
  initiation:
    bin_size: 900
    smoothing_sigma: 900
  sleep:
    bin_size: 900
    lower_percentile: 0.80
    upper_percentile: 0.95
    start_skew: [2, 5]
    end_skew: [2, 5]
    randomness_interval: 1800

paths:
  raw: data/raw
  processed: data/processed
  diary: data/diary
