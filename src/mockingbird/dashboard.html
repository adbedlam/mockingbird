<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persona · Наблюдение</title>
<style>
:root{--paper:#f6f5f0;--ink:#242b27;--muted:#737b74;--line:#dcded5;--accent:#456542;--light:#ebefe5;--danger:#9e4134}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,Segoe UI,sans-serif}button,select,input{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:232px;background:#e9ece3;padding:30px 22px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.brand{font-size:24px;letter-spacing:-1px;font-weight:650}.sub{color:var(--muted);font-size:12px}.identity{margin:28px 0 20px;font-weight:600}nav{display:grid;gap:5px}nav button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:5px;color:#626c60}nav button.active{background:#dce3d3;color:#233c21;font-weight:600}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px}.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#608256;margin-right:7px}main{margin-left:232px;padding:30px 42px;max-width:1700px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:25px;font-weight:600;letter-spacing:-.6px}h2{font-size:17px;font-weight:600;margin:0 0 13px}h3{font-size:14px;margin:0 0 8px}p{margin:8px 0}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,input[type=search]{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:4px;max-width:310px}input[type=search]{width:280px}.statusbar{padding:16px 0;display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;font-size:11px;letter-spacing:.15px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:#fff}.good{color:var(--accent);background:var(--light)}.bad{color:var(--danger);background:#f9ede6}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}.panel{border-top:2px solid var(--ink);padding-top:18px;margin-top:18px}.intro{font-size:13px;color:var(--muted);margin:0 0 20px}.metrics{display:flex;gap:30px;margin:12px 0 28px;border-bottom:1px solid var(--line);padding:10px 0 20px}.metric strong{display:block;font-size:27px;font-weight:500}.metric span{font-size:12px;color:var(--muted)}.row{border-bottom:1px solid var(--line);padding:14px 0}.rowhead{display:flex;justify-content:space-between;gap:8px;align-items:start}.time{font-size:11px;color:var(--muted);white-space:nowrap}.reason{font-size:13px;color:#45613e;margin-top:9px;border-left:2px solid #a8bb99;padding-left:12px;white-space:pre-wrap}.text{white-space:pre-wrap;word-break:break-word}.empty{color:var(--muted);padding:26px 0}.small{font-size:12px;color:var(--muted)}.chat{display:flex;flex-direction:column;gap:17px;margin-top:20px}.bubble{max-width:80%;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:8px}.bubble.self{align-self:flex-end;background:#e8eedf;border-color:#d4dec9}.bubblehead{font-size:11px;color:var(--muted);margin-bottom:7px}.link{background:none;border:0;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;text-underline-offset:3px}.block{background:#fff;border:1px solid var(--line);padding:16px;margin:12px 0}.note{padding:12px 15px;background:#ecefe6;color:#55624f;border-left:3px solid #a1b495;margin:10px 0 20px}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.7 ui-monospace,Consolas,monospace;margin:0}details{margin:10px 0}summary{cursor:pointer;color:var(--accent)}dialog{width:min(1000px,92vw);max-height:90vh;border:1px solid var(--line);background:var(--paper);padding:28px}dialog::backdrop{background:#18201b70}.close{float:right;border:1px solid var(--line);background:white;padding:5px 12px}.roles{padding:12px;margin:9px 0;background:#fff;border-left:3px solid #b9c5b0}.error{color:var(--danger)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:12px 0 22px}.wide{grid-column:1/-1}@media(max-width:920px){aside{width:180px;padding:24px 12px}main{margin-left:180px;padding:24px 22px}.grid{grid-template-columns:1fr}.tools select{max-width:210px}}@media(max-width:620px){aside{position:relative;width:auto;padding:16px}.identity,.sidefoot{display:none}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}main{margin:0;padding:18px}header{display:block}.tools{margin-top:15px}.metrics{gap:20px}.bubble{max-width:94%}input[type=search]{width:180px}}
</style></head><body>
<aside><div class="brand">persona<span style="color:#779068">.</span></div><div class="sub">локальное наблюдение</div><div class="identity" id="identity">Загружаем состояние</div><nav id="nav"></nav><div class="sidefoot"><span class="live"></span>Только чтение<br>Переписка остаётся на компьютере<br><span id="updated"></span></div></aside>
<main><header><div><h1 id="title">Обзор</h1><div class="sub">Как персона общается, принимает решения и запоминает</div></div><div class="tools"><select id="session" aria-label="Сессия"></select><label class="small"><input type="checkbox" id="auto" checked> автообновление</label></div></header><div class="statusbar" id="status"></div><div class="toolbar"><div class="small" id="scope"></div><input type="search" id="search" placeholder="Поиск по текущему разделу" aria-label="Поиск"></div><div id="content"></div><div id="error" class="error"></div></main>
<dialog id="detail"><button class="close" id="close">Закрыть</button><h2>Точный запрос к модели</h2><div id="detailbody"></div></dialog>
<script>
const $=id=>document.getElementById(id), key=new URLSearchParams(location.search).get('key')||'';
const views={overview:'Обзор',chat:'Переписка',decisions:'Решения модели',initiatives:'Инициативы',memory:'Память',diary:'Дневник и занятия',requests:'Запросы',events:'Все события'};
let state=null, view='overview', selected='', loading=false;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=String(text);if(cls)n.className=cls;return n}
function stamp(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(+d)?String(value):d.toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' МСК'}
function tag(text,cls=''){return el('span',text,'tag '+cls)}function match(row){return JSON.stringify(row).toLowerCase().includes($('search').value.toLowerCase())}
function empty(root,text){root.append(el('div',text,'empty'))}function panel(title){const n=el('section',null,'panel');n.append(el('h2',title));return n}
async function api(path){const r=await fetch(path,{headers:{'X-Dashboard-Key':key},cache:'no-store'});if(!r.ok)throw Error('Не удалось прочитать локальное состояние: HTTP '+r.status);return r.json()}
function requestButton(root,id){if(!/^[a-f0-9]{32}$/.test(id||''))return;const b=el('button','Открыть контекст и ответ','link');b.onclick=()=>openRequest(id);root.append(b)}
function eventRow(event){const n=el('article',null,'row'),head=el('div',null,'rowhead');head.append(tag(event.stage),el('span',stamp(event.at),'time'));n.append(head,el('div',event.message,'small'));const d=event.data||{};if(d.text)n.append(el('div',d.text,'text'));if(d.reason)n.append(el('div',(d.reason_source==='application'?'Проверка приложения: ':'Пояснение модели: ')+d.reason,'reason'));if(d.scheduler_reason)n.append(el('div',d.scheduler_reason,'reason'));if(d.change){const det=el('details'),s=el('summary','Что изменилось');det.append(s,el('pre',JSON.stringify(d.change,null,2)));n.append(det)}if(d.request_path)requestButton(n,d.request_path.split(/[\\/]/).pop().replace('.json',''));return n}
function events(root,rows){rows=rows.filter(match);if(!rows.length)return empty(root,'В выбранном фрагменте журнала таких событий пока нет.');for(const row of rows.slice().reverse())root.append(eventRow(row))}
function rowsOf(value){return Array.isArray(value)?value:[]}
function overview(root){const metrics=el('div',null,'metrics');for(const [label,value] of [['Сообщений в окне',state.history.length],['Запросов в окне',state.requests.length],['Инициатив сегодня',state.scheduler.initiations_sent??'—']]){const n=el('div',null,'metric');n.append(el('strong',value),el('span',label));metrics.append(n)}root.append(metrics);const grid=el('div',null,'grid'),activity=panel('Последние значимые события'),next=panel('Что запланировано');events(activity,state.events.filter(e=>!['WAIT','API_WAIT','BUSINESS_CONNECTION'].includes(e.stage)).slice(-12));const s=state.scheduler;next.append(el('p','Ожидаемый ответ: '+stamp(s.reply_due)));for(const slot of rowsOf(s.planned))next.append(el('p','Инициатива · '+stamp(slot)));if(!rowsOf(s.planned).length)next.append(el('p','Предстоящих инициатив в сохранённом расписании нет.','small'));next.append(el('p',state.note,'note'));const conn=state.business.connection;if(conn){next.append(el('h3','Telegram Business'),el('p','Владелец: '+conn.user?.id),el('p','Подключение: '+(conn.is_enabled?'активно':'отключено')),el('p','Право can_reply: '+!!conn.rights?.can_reply));const windows=Object.values(state.business.last_incoming||{});for(const w of windows)next.append(el('p','Последнее входящее: '+stamp(w.date*1000)),el('p','Окно отправки до: '+stamp((w.date+86400)*1000),'small'))}grid.append(activity,next);root.append(grid)}
function chat(root){const chat=el('div',null,'chat');for(const m of state.history.filter(match)){const n=el('article',null,'bubble '+(m.author===state.user?'self':''));n.append(el('div',m.author+' · '+stamp(m.timestamp)+' · id '+(m.message_id??'локальный'),'bubblehead'),el('div',m.text||m.picture_description||'[вложение]','text'));chat.append(n)}if(!chat.children.length)empty(root,'В выбранной сессии ещё нет сохранённой переписки.');root.append(chat)}
function decisions(root){root.append(el('p',state.note,'note'));events(root,state.events.filter(e=>e.data?.reason||['MODEL_SKIP','LIFE_PLAN','LIFE_CHANGED','BUSINESS_UNSENT','DISCARD'].includes(e.stage)))}
function initiatives(root){const s=state.scheduler;root.append(el('p','Отправлено сегодня: '+(s.initiations_sent??'—')+' · лимит: '+(s.config?.max_initiations_per_day??'—'),'note'));for(const t of rowsOf(s.planned))root.append(el('p','Предстоящая инициатива · '+stamp(t)));events(root,state.events.filter(e=>['PLAN','SKIP','MODEL_SKIP','SCHEDULE'].includes(e.stage)||e.data?.kind==='initiative'));const p=panel('Запросы самостоятельных сообщений');requestList(p,state.requests.filter(r=>r.kind==='initiative'));root.append(p)}
function memory(root){const current=panel('Актуальные записи'),audit=panel('Что запомнила или уточнила');for(const row of rowsOf(state.memory.entries).filter(match).slice().reverse()){const n=el('div',null,'row');n.append(el('div',row.content,'text'),el('div',[row.memory_id,'v'+(row.revision??0),row.state,row.topic,stamp(row.timestamp)].filter(Boolean).join(' · '),'small'));if(row.source_ids?.length)n.append(el('div','Основания: '+row.source_ids.join(', '),'small'));current.append(n)}if(current.children.length===1)empty(current,'Новых записей слоя памяти пока нет. Начальная память доступна в дневнике.');events(audit,state.events.filter(e=>/^DIARY_(ADDED|UPDATED|CONFIRMED|CONFLICT|RESULT|SKIP)$/.test(e.stage)));const grid=el('div',null,'grid');grid.append(current,audit);root.append(grid)}
function diary(root){root.append(el('p','Вымышленный день роли хранится отдельно от фактов из переписки.','note'));const grid=el('div',null,'grid'),day=panel('Занятия роли'),daily=panel('Ежедневный дневник');for(const [date,value] of Object.entries(state.life.days||{}).sort().reverse().slice(0,7)){const n=el('div',null,'block');n.append(el('h3',date+' · версия '+(value.revision??0)));for(const a of value.activities||[])n.append(el('p',a.start+'–'+a.end+' · '+a.activity));if(match(value))day.append(n)}daily.append(el('pre',state.daily_diary||'Итог смоделированного дня пока не записан.'));grid.append(day,daily);root.append(grid);const seed=panel('Начальная память из переписки');const entries=Array.isArray(state.seed_diary)?state.seed_diary:(state.seed_diary.entries||[]);for(const row of entries.filter(match).slice().reverse())seed.append(el('div',(row.content||'')+' · '+stamp(row.timestamp),'row text'));root.append(seed)}
function requestList(root,rows){for(const r of rows.filter(match)){const n=el('article',null,'row'),head=el('div',null,'rowhead');head.append(tag(r.kind||'запрос'),el('span',stamp(r.at),'time'));n.append(head,el('p',(r.status||'')+' · '+(r.elapsed_seconds??'—')+' сек.','small'));if(r.decision?.text)n.append(el('div',r.decision.text,'text'));if(r.decision?.reason)n.append(el('div',r.decision.reason,'reason'));if(r.error)n.append(el('div',r.error,'error'));requestButton(n,r.id);root.append(n)}if(!rows.length)empty(root,'В этой сессии запросов к модели пока нет.')}
function render(){if(!state)return;$('title').textContent=views[view];$('identity').textContent=state.user+' → '+state.other;$('updated').textContent='Снимок '+stamp(state.at);$('scope').textContent='Последние '+state.limits.events+' событий · '+state.limits.messages+' сообщений · '+state.limits.requests+' запросов';const status=$('status');status.replaceChildren();const conn=state.business.connection;if(conn){status.append(tag('Business '+(conn.is_enabled?'активен':'отключён'),conn.is_enabled?'good':'bad'),tag('can_reply '+!!conn.rights?.can_reply,conn.rights?.can_reply?'good':'bad'))}else status.append(tag('Business Connection не подтверждена'));status.append(tag('Просмотр без отправок'));if(state.business.send_enabled!==undefined)status.append(tag(state.business.send_enabled?'Отправки разрешены':'Отправки выключены',state.business.send_enabled?'good':'bad'));if(state.business.paused)status.append(tag('Персона на паузе'));if(state.business.review_required)status.append(tag('История требует сверки','bad'));if(state.deliveries.outbox?.some(r=>['unknown','sending','prepared'].includes(r.status)))status.append(tag('Есть несверенная отправка','bad'));const root=$('content');root.replaceChildren();({overview,chat,decisions,initiatives,memory,diary,requests:r=>requestList(r,state.requests),events:r=>events(r,state.events)})[view](root)}
async function refresh(){if(loading)return;loading=true;try{state=await api('/api/state'+(selected?'?session='+encodeURIComponent(selected):''));selected=state.session_id||'';const select=$('session');const ids=[...select.options].map(o=>o.value).join();if(ids!==state.sessions.map(s=>s.id).join()){select.replaceChildren();for(const s of state.sessions){const o=el('option',s.label);o.value=s.id;select.append(o)}}select.value=selected;$('error').textContent='';render()}catch(e){$('error').textContent=e.message}finally{loading=false}}
async function openRequest(id){try{const r=await api('/api/request?session='+encodeURIComponent(selected)+'&id='+id),root=$('detailbody');root.replaceChildren();root.append(el('p',(r.kind||'')+' · '+(r.status||'')+' · '+stamp(r.at),'small'),el('div',state.note,'note'));if(r.decision?.reason)root.append(el('div',r.decision.reason,'reason'));for(const m of r.messages||[]){const n=el('div',null,'roles');n.append(el('h3',m.role),el('pre',typeof m.content==='string'?m.content:JSON.stringify(m.content,null,2)));root.append(n)}const d=el('details'),summary=el('summary','Сырой ответ и полная запись запроса');d.append(summary,el('pre',JSON.stringify(r,null,2)));root.append(d);$('detail').showModal()}catch(e){$('error').textContent=e.message}}
for(const [id,label] of Object.entries(views)){const b=el('button',label,id===view?'active':'');b.onclick=()=>{view=id;for(const x of $('nav').children)x.classList.toggle('active',x===b);render()};$('nav').append(b)}$('session').onchange=()=>{selected=$('session').value;refresh()};$('search').oninput=render;$('close').onclick=()=>$('detail').close();refresh();setInterval(()=>{if($('auto').checked)refresh()},2500);
</script></body></html>
