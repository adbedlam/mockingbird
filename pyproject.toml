[project]
name = "mockingbird"
version = "0.1.0"
description = "A persistent digital agent that simulates a person's communication style, memory, and autonomous behavior."
readme = "README.md"
authors = [
    { name = "Silazemli", email = "you@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "emoji>=2.16.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.14.1",
]

[project.scripts]
mockingbird = "mockingbird:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
]

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"
src_paths = ["src"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
pretty = true
show_error_codes = true
