[project]
name = "mockingbird"
version = "0.1.0"
description = "A persistent digital agent that simulates a person's communication style, memory, and autonomous behavior."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
]

[project.scripts]
mockingbird = "mockingbird.mockingbird:main"
mockingbird-telegram = "mockingbird.telegram:main"
mockingbird-business = "mockingbird.telegram_business:main"
mockingbird-dashboard = "mockingbird.dashboard:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"
src_paths = ["src"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
pretty = true
show_error_codes = true
exclude = [
    '\.venv/',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
