[project]
name = "mockingbird"
version = "0.1.0"
description = "A persistent digital agent that simulates a person's communication style, memory, and autonomous behavior."
readme = "README.md"
authors = [
    { name = "Silazemli", email = "you@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
]

[project.scripts]
mockingbird = "mockingbird:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
