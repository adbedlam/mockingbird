default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pycqa/isort
    rev: "9.0.1"
    hooks:
      - id: isort
        name: isort
        args: ["--filter-files"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: "26.5.1"
    hooks:
      - id: black
        name: black

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^src/
